<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients · Kudz Admin</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/admin.css">
<link rel="stylesheet" href="assets/dash-polish.css">
<link rel="stylesheet" href="assets/responsive.css">
<style>
  body { background: var(--bg); }
  .admin-main-inner { max-width: 1280px; margin: 0 auto; }
  .ac-head { padding: 32px 0 20px; }
  .ac-head .eyebrow { margin-bottom: 12px; }
  .ac-head h1 { font-family: var(--font-sans); font-weight: 500; font-size: clamp(28px, 3.2vw, 40px); line-height: 1; letter-spacing: -0.03em; }
  .ac-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .t-due, .t-planner, .t-review { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
  a.t-row { color: inherit; text-decoration: none; }
  .ac-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
  @media (max-width:980px){ .ac-stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="admin-nav"></div>

<div class="admin-app">
  <div id="admin-side" data-active="clients"></div>
  <main class="admin-main">
  <div id="admin-clients-page" class="admin-main-inner">

    <section class="ac-head">
      <div class="eyebrow">Practice Console · Clients</div>
      <h1>Client roster</h1>
    </section>

    <div class="kpi-row ac-stats" id="ac-stats"></div>

    <div class="ac-toolbar">
      <div class="chips-bar" id="admin-filters" style="margin:0;">
        <button class="chip-btn" data-filter="all" data-active="true">All</button>
        <button class="chip-btn" data-filter="bespoke">Bespoke</button>
        <button class="chip-btn" data-filter="family">Family</button>
        <button class="chip-btn" data-filter="standard">Standard</button>
        <button class="chip-btn" data-filter="review">Needs attention</button>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <input class="t-panel-search" id="admin-search" type="search" placeholder="Search name or planner…">
        <button class="btn btn-secondary btn-sm" id="ac-sort">Sort: Net worth ↓</button>
      </div>
    </div>

    <div class="t-panel" id="admin-roster"></div>

  </div>
  </main>
</div>

<div id="site-footer"></div>

<script src="assets/admin.js"></script>
<script src="assets/admin-search.js"></script>
<script src="assets/admin-pages.js"></script>
</body>
</html>
