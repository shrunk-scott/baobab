document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

l[data-palette=\"sage\"] {\n  --bg:        #F5F1E8;\n  --surface:   #FFFFFF;\n  --surface-2: #FAF6EC;\n  --panel:     #ECE6D7;\n  --ink:       #1F2A1E;\n  --ink-2:     #3F4A3D;\n  --ink-3:     #6B7367;\n  --ink-4:     #A0A595;\n  --hair-c:    #D8D2C2;\n  --hair-2:    #E8E2D2;\n  --primary:   #3D6B47;       /* sage / forest */\n  --primary-2: #527E5B;\n  --primary-tint: #DCE8DC;\n  --accent:    #B98A2B;       /* amber */\n  --accent-2:  #D4A547;\n  --accent-tint: #EFE4C8;\n  --pos:       #2F7A45;\n  --neg:       #B0432B;\n  --warn:      #B98A2B;\n}\n\n/* ─── PALETTE 2 — MINERAL (luxe dark) ─────────────────────────────── */\nhtml[data-palette=\"mineral\"] {\n  --bg:        #15171A;\n  --surface:   #1C1F23;\n  --surface-2: #20242A;\n  --panel:     #2A2F36;\n  --ink:       #ECECE8;\n  --ink-2:     #B8BCB8;\n  --ink-3:     #828780;\n  --ink-4:     #5A5F58;\n  --hair-c:    #2E343C;\n  --hair-2:    #262B32;\n  --primary:   #8FB69A;       /* lichen */\n  --primary-2: #A8CBB1;\n  --primary-tint: #2D3833;\n  --accent:    #D6A24B;       /* brass */\n  --accent-2:  #E8B967;\n  --accent-tint: #3A2F1B;\n  --pos:       #7FB58E;\n  --neg:       #D77A5C;\n  --warn:      #D6A24B;\n}\n\n/* ─── PALETTE 3 — CLOUD (airy editorial fintech) ──────────────────── */\nhtml[data-palette=\"cloud\"] {\n  --bg:        #FBFAF7;\n  --surface:   #FFFFFF;\n  --surface-2: #F4F2EC;\n  --panel:     #EDEAE0;\n  --ink:       #14171A;\n  --ink-2:     #3A3F45;\n  --ink-3:     #6E737A;\n  --ink-4:     #A6ABB0;\n  --hair-c:    #E2DFD5;\n  --hair-2:    #EFEDE5;\n  --primary:   #0F4D3A;       /* deep emerald */\n  --primary-2: #186B52;\n  --primary-tint: #DDE9E2;\n  --accent:    #C7522A;       /* burnt sienna */\n  --accent-2:  #E2734A;\n  --accent-tint: #F4DDD0;\n  --pos:       #186B52;\n  --neg:       #C7522A;\n  --warn:      #B98A2B;\n}\n\n/* ─── BASE ─────────────────────────────────────────────────────────── */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml {\n  background-color: var(--bg);\n}\nhtml, body {\n  margin: 0;\n  padding: 0;\n  color: var(--ink);\n  font-family: var(--font-sans);\n  font-size: 15px;\n  line-height: 1.55;\n  font-feature-settings: \"ss01\", \"tnum\", \"cv11\";\n  -webkit-font-smoothing: antialiased;\n  text-rendering: geometricPrecision;\n  transition: background 0.4s var(--ease), color 0.4s var(--ease);\n}\n\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; cursor: pointer; }\nimg { max-width: 100%; display: block; }\n\n::selection { background: var(--primary); color: var(--surface); }\n\n/* Numerals — tabular for any element with .num */\n.num, .mono { font-family: var(--font-mono); font-feature-settings: \"tnum\"; }\n\n/* ─── LAYOUT ──────────────────────────────────────────────────────── */\n\n.container {\n  max-width: 1280px;\n  margin: 0 auto;\n  padding: 0 var(--s-8);\n}\n.container-wide {\n  max-width: 1480px;\n  margin: 0 auto;\n  padding: 0 var(--s-8);\n}\n.container-narrow {\n  max-width: 880px;\n  margin: 0 auto;\n  padding: 0 var(--s-8);\n}\n\n@media (max-width: 720px) {\n  .container, .container-wide, .container-narrow { padding: 0 var(--s-5); }\n}\n\n/* ─── TYPE ────────────────────────────────────────────────────────── */\n\n.eyebrow {\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 24px;\n  height: 1px;\n  background: var(--ink-3);\n}\n.eyebrow.no-rule::before { display: none; }\n\nh1, h2, h3, h4 { font-weight: 500; letter-spacing: -0.015em; margin: 0; color: var(--ink); }\n\n.display-1 {\n  font-family: var(--font-serif);\n  font-weight: 400;\n  font-size: clamp(56px, 7.5vw, 110px);\n  line-height: 0.95;\n  letter-spacing: -0.025em;\n}\n.display-1 em { font-style: italic; color: var(--primary); }\n\n.display-2 {\n  font-family: var(--font-serif);\n  font-weight: 400;\n  font-size: clamp(40px, 5vw, 68p  font-size: 10px; letter-spacing: 0.18em;\n  text-transform: uppercase; color: var(--ink-3);\n  animation: bb-cue-fade 2.4s var(--ease) infinite;\n}\n.bb-scrollcue-track {\n  width: 22px; height: 36px; border-radius: 999px;\n  border: 1.5px solid var(--ink-3);\n  display: flex; justify-content: center; padding-top: 6px;\n  opacity: 0.7;\n}\n.bb-scrollcue-dot {\n  width: 3px; height: 7px; border-radius: 999px; background: var(--ink-2);\n  animation: bb-cue-dot 2.4s var(--ease) infinite;\n}\n@keyframes bb-cue-dot {\n  0% { transform: translateY(0); opacity: 0; }\n  25% { opacity: 1; }\n  60% { transform: translateY(12px); opacity: 0; }\n  100% { transform: translateY(12px); opacity: 0; }\n}\n@keyframes bb-cue-fade {\n  0%, 100% { opacity: 0.5; }\n  50% { opacity: 1; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .bb-scrollcue-dot, .bb-scrollcue-label { animation: none; }\n}\n\n/* ─── RETURN TO TOP ──────────────────────────────────────────────── */\n.bb-scrolltop {\n  position: fixed; bottom: 20px; right: 72px; z-index: 980;\n  width: 40px; height: 40px; border-radius: 999px;\n  background: var(--surface); color: var(--ink);\n  border: 1px solid var(--hair-c);\n  display: grid; place-items: center; cursor: pointer;\n  box-shadow: 0 6px 20px rgba(0,0,0,0.12);\n  opacity: 0; transform: translateY(10px) scale(0.9); pointer-events: none;\n  transition: opacity .2s var(--ease), transform .2s var(--ease), border-color .15s var(--ease);\n}\n.bb-scrolltop[data-show=\"true\"] { opacity: 1; transform: none; pointer-events: auto; }\n.bb-scrolltop:hover { border-color: var(--ink); }\n@media (max-width: 600px) { .bb-scrolltop { right: 16px; bottom: 68px; } }\n\n.nav-hamburger {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--hair-c);\n  border-radius: 8px;\n  width: 38px; height: 38px;\n  padding: 0;\n  cursor: pointer;\n  position: relative;\n  margin-left: 8px;\n  transition: border-color 0.15s var(--ease);\n}\n.nav-hamburger:hover { border-color: var(--ink); }\n.nav-hamburger span {\n  display: block;\n  position: absolute; left: 9px; right: 9px;\n  height: 1.5px;\n  background: var(--ink);\n  border-radius: 2px;\n  transition: transform 0.2s var(--ease), opacity 0.15s var(--ease);\n}\n.nav-hamburger span:nth-child(1) { top: 12px; }\n.nav-hamburger span:nth-child(2) { top: 18px; }\n.nav-hamburger span:nth-child(3) { top: 24px; }\n.nav-hamburger[aria-expanded=\"true\"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }\n.nav-hamburger[aria-expanded=\"true\"] span:nth-child(2) { opacity: 0; }\n.nav-hamburger[aria-expanded=\"true\"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }\n\n/* ─── DRAWER ─────────────────────────────────────────────────────── */\n.nav-drawer {\n  display: none;\n  background: var(--bg);\n  border-top: 1px solid var(--hair-c);\n  padding: 20px 24px 28px;\n  max-height: calc(100vh - 64px);\n  overflow-y: auto;\n}\n.nav-drawer-links {\n  display: flex; flex-direction: column;\n  margin-bottom: 22px;\n}\n.nav-drawer-links a {\n  padding: 14px 4px;\n  border-bottom: 1px solid var(--hair-2);\n  font-size: 17px;\n  font-weight: 500;\n  letter-spacing: -0.01em;\n  color: var(--ink-2);\n  display: flex; align-items: center; justify-content: space-between;\n  transition: color 0.15s var(--ease);\n}\n.nav-drawer-links a::after {\n  content: \"→\";\n  color: var(--ink-3);\n  font-family: var(--font-mono);\n  transition: transform 0.15s var(--ease);\n}\n.nav-drawer-links a:hover { color: var(--ink); }\n.nav-drawer-links a:hover::after { transform: translateX(4px); color: var(--accent); }\n.nav-drawer-links a.is-active { color: var(--ink); }\n.nav-drawer-links a.is-active::after { color: var(--accent); content: \"●\"; }\n\n.nav-drawer-cta {\n  display: flex; flex-direction: column; gap: 10px;\n}\n.nav-drawer-cta .btn {\n  width: 100%; height: 48px;\n  justify-content: center;\n  font-size: 15px;\n  border-radius: 10px;\n}\n.nav-drawer-user {\n  display: flex; gap: 12px; }\n}\n\n/* ─── FOCUS RINGS (accessibility quick win) ──────────────────────── */\n:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n  border-radius: 4px;\n}\n.btn:focus-visible,\n.field:focus-visible,\n.dash-tab:focus-visible,\n.tile:focus-visible,\n.chip-btn:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n.input:focus-visible {\n  outline: 0;\n  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 28%, transparent);\n  border-color: var(--accent);\n}\n\n/* ─── CHART INTERACTIVITY ─────────────────────────────────────────── */\n.chart-tip {\n  position: fixed;\n  z-index: 9000;\n  pointer-events: none;\n  background: var(--ink);\n  color: var(--bg);\n  padding: 8px 12px;\n  border-radius: 8px;\n  font-family: var(--font-sans);\n  font-size: 12px;\n  line-height: 1.35;\n  box-shadow: 0 8px 24px -8px rgba(0,0,0,0.35);\n  letter-spacing: -0.005em;\n  min-width: 100px;\n}\n.chart-tip[hidden] { display: none; }\n.chart-tip .tip-l {\n  font-family: var(--font-mono);\n  font-size: 10px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: color-mix(in oklch, var(--bg) 55%, transparent);\n  margin-bottom: 4px;\n}\n.chart-tip .tip-v {\n  font-family: var(--font-mono);\n  font-size: 14px;\n  font-weight: 500;\n  letter-spacing: -0.015em;\n  color: var(--bg);\n}\n.chart-tip .tip-s {\n  font-size: 10px;\n  color: color-mix(in oklch, var(--bg) 65%, transparent);\n  margin-top: 4px;\n}\n.donut-slice {\n  transition: transform 0.18s var(--ease), opacity 0.18s var(--ease);\n  transform-origin: 50px 50px;\n  cursor: pointer;\n}\n.chart-hit { cursor: crosshair; }\n\n/* ─── PRINT (bonus) ──────────────────────────────────────────────── */\n@media print {\n  .site-nav, .site-footer, #bb-tweaks, .v2-status, .v2-scrollbar,\n  .dash-toolbar, .dash-side, .onboarding-banner, .planner-card {\n    display: none !important;\n  }\n  body { background: white; color: black; }\n  .dash-main { padding: 0; }\n}\n<\u002Fst     color: var(--accent);\n  }\n  .auth-side .stats .l {\n    font-size: 11px;\n    color: color-mix(in oklch, var(--bg) 60%, transparent);\n    margin-top: 8px;\n    line-height: 1.4;\n    letter-spacing: 0.04em;\n  }\n\n  /* ── RHS — form side ─────────────────────────────────────── */\n  .auth-main {\n    background: var(--surface);\n    padding: 48px 64px 56px;\n    display: flex; flex-direction: column;\n  }\n  .auth-topbar {\n    display: flex; justify-content: space-between; align-items: center;\n    margin-bottom: 32px;\n    font-size: 13px;\n    color: var(--ink-3);\n  }\n  .auth-topbar a { color: var(--ink-2); }\n  .auth-topbar a:hover { color: var(--ink); }\n  .auth-topbar .right { display: flex; gap: 16px; align-items: center; }\n  .note { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }\n\n  .auth-wrap { max-width: 440px; width: 100%; margin: auto 0; }\n  .auth-wrap h1 {\n    font-family: var(--font-sans);\n    font-weight: 500;\n    font-size: clamp(32px, 3.6vw, 44px);\n    line-height: 1;\n    letter-spacing: -0.025em;\n    color: var(--ink);\n    margin: 0 0 12px;\n  }\n  .auth-wrap h1 em {\n    font-family: var(--font-serif); font-style: italic; font-weight: 400;\n    color: var(--primary);\n  }\n  .auth-wrap .deck {\n    color: var(--ink-2);\n    font-size: 15px;\n    line-height: 1.55;\n    margin: 0 0 32px;\n  }\n\n  .field-block { margin-bottom: 18px; }\n  .field-block label {\n    display: block;\n    font-size: 12px;\n    color: var(--ink-2);\n    letter-spacing: 0.04em;\n    margin-bottom: 6px;\n  }\n  .field-block .row {\n    display: flex; justify-content: space-between; align-items: center;\n    margin-bottom: 6px;\n  }\n  .field-block .row a {\n    font-size: 12px; color: var(--ink-3);\n  }\n  .field-block .row a:hover { color: var(--primary); }\n\n  .input {\n    width: 100%; height: 48px;\n    background: var(--bg);\n    border: 1px solid var(--hair-c);\n    border-radius: 10px;\n    padding : 16px; }\n  .login-error[hidden] { display: none; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"auth-shell\">\n\n  <!-- ── LEFT EDITORIAL SIDE ───────────────────────────────────── -->\n  <aside class=\"auth-side\">\n    <div class=\"brand\">\n      <span class=\"brand-mark\"><\u002Fspan>\n      <span class=\"brand-text\">\n        <span class=\"b1\">Baobab<\u002Fspan>\n        <span class=\"b2\">Consulting<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"lhs-content\">\n      <div class=\"eyebrow\">Client portal<\u002Fdiv>\n      <h2>Welcome back.<br>Your <em>plan<\u002Fem> is waiting.<\u002Fh2>\n\n      <!-- Snapshot of last open state -->\n      <div class=\"client-snap\">\n        <div class=\"head\">\n          <span>Jones Family · last open Apr 28<\u002Fspan>\n          <span class=\"live\">live<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"grid\">\n          <div class=\"cell\">\n            <div class=\"l\">Net worth<\u002Fdiv>\n            <div class=\"v\">$2.84m<\u002Fdiv>\n            <div class=\"d\">+1.7% QoQ<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cell\">\n            <div class=\"l\">Savings rate<\u002Fdiv>\n            <div class=\"v\">23.4%<\u002Fdiv>\n            <div class=\"d\">+1.8 pp<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cell\">\n            <div class=\"l\">Tax due (est.)<\u002Fdiv>\n            <div class=\"v\">$54.2k<\u002Fdiv>\n            <div class=\"d\">on track<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cell\">\n            <div class=\"l\">Next review<\u002Fdiv>\n            <div class=\"v\" style=\"font-family: var(--font-sans); font-size: 18px; letter-spacing: -0.01em;\">14 Jul · 10:00<\u002Fdiv>\n            <div class=\"d\">with K. Mhishi<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stats\">\n      <div><div class=\"v\">187<\u002Fdiv><div class=\"l\">Active households<\u002Fdi
