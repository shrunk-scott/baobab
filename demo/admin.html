<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Console · Kudz Admin</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/admin.css">
<link rel="stylesheet" href="assets/dash-polish.css">
<link rel="stylesheet" href="assets/responsive.css">
<style>
  body { background: var(--bg); }
  .admin-wrap { max-width: 1480px; margin: 0 auto; padding: 0 var(--s-8); }
  .admin-hero { padding: 32px 0 24px; }
  .admin-hero .eyebrow { margin-bottom: 12px; }
  .admin-hero h1 {
    font-family: var(--font-sans); font-weight: 500;
    font-size: clamp(30px, 3.4vw, 44px); line-height: 1; letter-spacing: -0.03em;
  }
  .admin-hero .sub { color: var(--ink-2); margin-top: 10px; font-size: 14px; }
  .admin-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 18px; margin: 8px 0 28px; }
  @media (max-width: 1080px) { .admin-grid { grid-template-columns: 1fr; } }
  .t-due { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .t-planner, .t-review { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
  .roster-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .roster-head h2 { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
  a.t-row { color: inherit; text-decoration: none; }
  .section-gap { margin-top: 28px; }
  .admin-search-hint { margin-left: 2px; }
  @media (max-width: 720px) { .admin-search-hint { display: none; } }
</style>
</head>
<body>
<div id="admin-nav"></div>

<div class="admin-app">
  <div id="admin-side" data-active="overview"></div>
  <main class="admin-main">
  <div id="admin-overview" class="admin-main-inner">

  <section class="admin-hero">
    <div class="eyebrow">Practice Console</div>
    <h1>Good morning, Kudzai.</h1>
    <div class="sub" id="admin-hero-sub">households · reviews due this month · open tasks across the practice.</div>
  </section>

  <div class="kpi-row" id="admin-kpis"></div>

  <div class="admin-grid section-gap">
    <div class="t-panel">
      <div class="t-panel-head">
        <h2>This week's tasks</h2>
        <a href="admin-tasks.html" class="btn btn-ghost btn-sm">All tasks →</a>
      </div>
      <div id="admin-tasks"></div>
    </div>
    <div class="t-panel">
      <div class="t-panel-head"><h2>Activity</h2><span class="note">live</span></div>
      <ul class="activity" id="admin-activity"></ul>
    </div>
  </div>

  <section class="section-gap" style="padding-bottom: 8px;">
    <div class="roster-head">
      <h2>Client roster</h2>
      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
        <div class="chips-bar" id="admin-filters" style="margin:0;">
          <button class="chip-btn" data-filter="all" data-active="true">All</button>
          <button class="chip-btn" data-filter="bespoke">Bespoke</button>
          <button class="chip-btn" data-filter="family">Family</button>
          <button class="chip-btn" data-filter="standard">Standard</button>
          <button class="chip-btn" data-filter="review">Needs attention</button>
        </div>
        <input class="t-panel-search" id="admin-search" type="search" placeholder="Search clients…">
      </div>
    </div>
    <div class="t-panel" id="admin-roster"></div>
  </section>

  </div>
  </main>
</div>

<div id="site-footer"></div>

<script src="assets/admin.js"></script>
<script src="assets/admin-search.js"></script>
<script src="assets/admin-pages.js"></script>
</body>
</html>
